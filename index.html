<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SidelineReel Coach Review</title>
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sidelinereel-coach-review.onrender.com" />
    <meta property="og:title" content="SidelineReel Coach Review" />
    <meta property="og:description" content="Coach review for AI-tagged highlight reels: confirm or reassign flagged jersey-number matches before reels go to parents." />
    <meta property="og:image" content="https://sidelinereel-coach-review.onrender.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* First-paint loader. Renders instantly from HTML/CSS so there is never a
         blank white flash while the JS bundle loads. React replaces #root on mount. */
      html, body { margin: 0; height: 100%; background-color: #0b0f14; }
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      #app-loader .spinner {
        width: 34px;
        height: 34px;
        border-radius: 9999px;
        border: 3px solid rgba(34, 197, 94, 0.2);
        border-top-color: #22c55e;
        animation: app-spin 0.8s linear infinite;
      }
      #app-loader .label {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #64748b;
      }
      @keyframes app-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #app-loader .spinner { animation-duration: 2s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loader">
        <div class="spinner"></div>
        <div class="label">SidelineReel</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
